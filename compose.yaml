networks:
  web:
    external: true
    name: homelab-web

services:
  diesel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: diesel
    restart: unless-stopped
    depends_on:
      - diesel-api
    networks:
      - web
    ports:
      - "8147:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  diesel-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: diesel-api
    restart: unless-stopped
    user: "1000:1000"
    networks:
      - web
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
